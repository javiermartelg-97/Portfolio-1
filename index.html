<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portfolio Tracker · Pro</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --navy:    #0a1628;
  --navy2:   #0f2044;
  --navy3:   #16305a;
  --blue:    #1a6ef5;
  --blue2:   #3b8bff;
  --blue3:   #d0e4ff;
  --grey1:   #f0f4fa;
  --grey2:   #e2e8f4;
  --grey3:   #b8c5d6;
  --grey4:   #7a90aa;
  --white:   #ffffff;
  --text:    #0a1628;
  --muted:   #5a7090;
  --green:   #0fa065;
  --green2:  #e6f7f0;
  --red:     #d93025;
  --red2:    #fde8e8;
  --amber:   #f59e0b;
  --border:  rgba(10,22,40,0.09);
  --shadow:  0 1px 4px rgba(10,22,40,0.08);
  --shadow2: 0 4px 20px rgba(10,22,40,0.12);
  --r:       10px;
  --r2:      6px;
  --font:    'Inter', sans-serif;
  --mono:    'IBM Plex Mono', monospace;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;background:var(--grey1);color:var(--text);font-family:var(--font);font-size:14px;line-height:1.5;}

/* ─── LAYOUT ─── */
.shell{display:flex;height:100vh;overflow:hidden;}
.sidebar{width:236px;min-width:236px;background:var(--navy);display:flex;flex-direction:column;overflow-y:auto;}
.content-area{flex:1;overflow-y:auto;display:flex;flex-direction:column;}
.topbar{background:var(--white);border-bottom:1px solid var(--border);padding:0 28px;height:54px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;position:sticky;top:0;z-index:50;}
.page{padding:24px 28px;flex:1;}

/* ─── SIDEBAR ─── */
.sb-logo{padding:22px 20px 16px;border-bottom:1px solid rgba(255,255,255,0.07);}
.sb-logo h1{font-size:17px;font-weight:700;color:#fff;letter-spacing:-.3px;}
.sb-logo span{font-size:10px;color:rgba(255,255,255,0.3);letter-spacing:2px;text-transform:uppercase;}
.sb-section{font-size:10px;color:rgba(255,255,255,0.25);letter-spacing:2px;text-transform:uppercase;padding:16px 20px 5px;}
.nav{display:flex;flex-direction:column;gap:1px;}
.nv{display:flex;align-items:center;gap:9px;padding:9px 20px;cursor:pointer;color:rgba(255,255,255,0.5);font-size:13px;font-weight:500;border-left:2px solid transparent;transition:all .13s;}
.nv svg{width:15px;height:15px;flex-shrink:0;}
.nv:hover{color:rgba(255,255,255,0.85);background:rgba(255,255,255,0.05);}
.nv.on{color:#fff;border-left-color:var(--blue2);background:rgba(26,110,245,0.12);}
.sb-bottom{margin-top:auto;padding:14px 16px;border-top:1px solid rgba(255,255,255,0.07);}
.sb-pf-card{background:rgba(255,255,255,0.05);border-radius:8px;padding:12px 14px;}
.sb-pf-val{font-size:20px;font-weight:700;color:#fff;}
.sb-pf-chg{font-size:12px;margin-top:2px;}
.sb-reset{width:100%;margin-top:8px;padding:6px;border-radius:5px;background:transparent;border:1px solid rgba(255,255,255,0.1);color:rgba(255,255,255,0.25);cursor:pointer;font-size:10px;font-family:var(--font);}
.sb-reset:hover{color:rgba(255,255,255,0.5);}

/* ─── TOPBAR ─── */
.tb-left{display:flex;align-items:center;gap:14px;}
.tb-title{font-size:16px;font-weight:600;color:var(--text);}
.tb-sub{font-size:12px;color:var(--muted);}
.tb-right{display:flex;align-items:center;gap:8px;}
.live-pill{display:flex;align-items:center;gap:5px;background:var(--green2);color:var(--green);border-radius:20px;padding:3px 10px;font-size:11px;font-weight:600;}
.live-dot{width:6px;height:6px;border-radius:50%;background:var(--green);animation:pulse 2s infinite;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.btn{padding:7px 14px;border-radius:var(--r2);border:1px solid var(--border);background:var(--white);color:var(--text);cursor:pointer;font-family:var(--font);font-size:12px;font-weight:500;display:inline-flex;align-items:center;gap:5px;transition:all .13s;}
.btn:hover{background:var(--grey2);border-color:var(--grey3);}
.btn-blue{background:var(--blue);color:#fff;border-color:var(--blue);}
.btn-blue:hover{background:#155ed4;}
.btn-sm{padding:5px 10px;font-size:11px;}

/* ─── TABS ─── */
.tabs{display:flex;gap:0;border-bottom:1px solid var(--border);background:var(--white);padding:0 28px;flex-shrink:0;}
.tab{padding:12px 16px;cursor:pointer;font-size:13px;font-weight:500;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap;transition:all .13s;}
.tab:hover{color:var(--text);}
.tab.on{color:var(--blue);border-bottom-color:var(--blue);}

/* ─── KPIs ─── */
.kpi-row{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:20px;}
.kpi{background:var(--white);border:1px solid var(--border);border-radius:var(--r);padding:16px 18px;box-shadow:var(--shadow);}
.kpi-l{font-size:11px;color:var(--muted);letter-spacing:.5px;text-transform:uppercase;margin-bottom:6px;font-weight:500;}
.kpi-v{font-size:20px;font-weight:700;line-height:1.2;}
.kpi-s{font-size:11px;margin-top:4px;}
.up{color:var(--green);}
.dn{color:var(--red);}
.nt{color:var(--muted);}

/* ─── CARDS ─── */
.card{background:var(--white);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow);}
.card-h{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--border);}
.card-title{font-size:13px;font-weight:600;color:var(--text);}
.card-body{padding:20px;}
.grid2{display:grid;grid-template-columns:2fr 1fr;gap:14px;margin-bottom:20px;}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;margin-bottom:20px;}

/* ─── TABLE ─── */
.tbl-wrap{overflow-x:auto;}
table{width:100%;border-collapse:collapse;}
th{text-align:left;font-size:11px;color:var(--muted);font-weight:600;letter-spacing:.5px;text-transform:uppercase;padding:10px 14px;border-bottom:1px solid var(--border);white-space:nowrap;}
td{padding:11px 14px;border-bottom:1px solid var(--border);font-size:13px;white-space:nowrap;}
tr:last-child td{border-bottom:none;}
tr:hover td{background:var(--grey1);}
.sym{font-size:11px;font-weight:700;background:var(--navy);color:#fff;border-radius:4px;padding:3px 7px;font-family:var(--mono);letter-spacing:.5px;display:inline-block;}
.sym.red{background:#c0392b;}
.sym.green{background:#1a7a50;}
.sym.blue{background:var(--blue);}
.sym.purple{background:#6c3fc7;}
.sym.teal{background:#0e7a8a;}
.sym.amber{background:#b45309;}
.sym.pink{background:#a3315a;}
.sym.navy{background:var(--navy2);}
.co-name{font-size:12px;color:var(--muted);margin-top:1px;}
.badge{display:inline-block;padding:2px 8px;border-radius:3px;font-size:10px;font-weight:700;letter-spacing:.5px;}
.b-buy{background:var(--green2);color:var(--green);}
.b-sell{background:var(--red2);color:var(--red);}
.b-hold{background:#fffbe6;color:#b45309;}
.weight-track{width:80px;height:5px;background:var(--grey2);border-radius:3px;overflow:hidden;margin-top:3px;}
.weight-fill{height:100%;border-radius:3px;}
.chg-pill{display:inline-block;padding:2px 7px;border-radius:4px;font-size:11px;font-weight:600;}
.chg-up{background:var(--green2);color:var(--green);}
.chg-dn{background:var(--red2);color:var(--red);}
.chg-nt{background:var(--grey2);color:var(--muted);}

/* ─── ACTIVITY ─── */
.act-list{display:flex;flex-direction:column;gap:0;}
.act-item{display:flex;align-items:center;padding:13px 20px;border-bottom:1px solid var(--border);gap:14px;transition:background .1s;}
.act-item:hover{background:var(--grey1);}
.act-item:last-child{border-bottom:none;}
.act-ico{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.act-ico.buy{background:var(--green2);}
.act-ico.sell{background:var(--red2);}
.act-ico svg{width:16px;height:16px;}
.act-body{flex:1;}
.act-title{font-size:13px;font-weight:600;}
.act-sub{font-size:11px;color:var(--muted);margin-top:1px;}
.act-val{text-align:right;}
.act-amount{font-size:14px;font-weight:600;}
.act-pnl{font-size:11px;margin-top:2px;}
.act-badge{display:inline-block;padding:1px 7px;border-radius:10px;font-size:10px;font-weight:600;margin-left:6px;}

/* ─── NEWS ─── */
.news-list{display:flex;flex-direction:column;gap:0;}
.news-item{padding:14px 20px;border-bottom:1px solid var(--border);display:flex;gap:12px;}
.news-item:last-child{border-bottom:none;}
.news-item:hover{background:var(--grey1);}
.news-src{flex-shrink:0;display:flex;flex-direction:column;align-items:center;gap:3px;}
.news-src-badge{font-size:9px;font-weight:700;padding:2px 6px;border-radius:3px;text-transform:uppercase;letter-spacing:.5px;}
.news-body{flex:1;}
.news-headline{font-size:13px;font-weight:600;color:var(--text);cursor:pointer;line-height:1.4;}
.news-headline:hover{color:var(--blue);}
.news-meta{font-size:11px;color:var(--muted);margin-top:3px;}
.news-tickers{margin-top:5px;display:flex;gap:4px;flex-wrap:wrap;}
.news-ticker{font-size:10px;background:var(--blue3);color:var(--blue);padding:1px 6px;border-radius:3px;font-weight:600;}
.news-sentiment{font-size:10px;padding:2px 7px;border-radius:3px;font-weight:600;}
.sent-pos{background:var(--green2);color:var(--green);}
.sent-neg{background:var(--red2);color:var(--red);}
.sent-nt{background:var(--grey2);color:var(--muted);}

/* ─── AI / ANALYST ─── */
.ai-banner{background:linear-gradient(135deg,var(--navy2) 0%,var(--navy3) 100%);border-radius:var(--r);padding:20px 24px;margin-bottom:16px;color:#fff;position:relative;overflow:hidden;}
.ai-banner::before{content:'AI';position:absolute;right:20px;top:50%;transform:translateY(-50%);font-size:80px;font-weight:700;opacity:.06;font-family:var(--font);}
.ai-model{font-size:10px;color:var(--blue2);letter-spacing:1.5px;text-transform:uppercase;font-weight:700;margin-bottom:8px;}
.ai-text{font-size:13px;line-height:1.7;color:rgba(255,255,255,0.88);}
.ai-sources{margin-top:10px;display:flex;gap:6px;flex-wrap:wrap;}
.ai-src-tag{font-size:10px;background:rgba(255,255,255,0.1);color:rgba(255,255,255,0.6);padding:2px 8px;border-radius:3px;border:1px solid rgba(255,255,255,0.15);}

.analyst-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;margin-bottom:16px;}
.analyst-card{background:var(--white);border:1px solid var(--border);border-radius:var(--r);padding:14px 16px;}
.an-sym{margin-bottom:8px;}
.an-rating{font-size:13px;font-weight:700;}
.an-target{font-size:12px;color:var(--muted);margin-top:2px;}
.an-upside{font-size:12px;font-weight:600;margin-top:4px;}
.an-bar{height:4px;background:var(--grey2);border-radius:2px;margin-top:8px;overflow:hidden;}
.an-bar-fill{height:100%;border-radius:2px;background:var(--blue);}

/* ─── CHART ─── */
.chart-wrap{position:relative;height:260px;}
.chart-legend{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:10px;font-size:11px;}
.chart-legend span{display:flex;align-items:center;gap:5px;}
.cleg-dot{width:8px;height:8px;border-radius:2px;flex-shrink:0;}

/* ─── DONUT ─── */
.donut-layout{display:flex;gap:20px;align-items:flex-start;}
.donut-wrap{position:relative;height:220px;min-width:220px;}
.donut-legend{display:flex;flex-direction:column;gap:8px;flex:1;}
.dl-item{display:flex;align-items:center;gap:8px;font-size:12px;}
.dl-dot{width:8px;height:8px;border-radius:2px;flex-shrink:0;}

/* ─── LOADING / SKELETON ─── */
.skeleton{background:linear-gradient(90deg,var(--grey2) 25%,var(--grey1) 50%,var(--grey2) 75%);background-size:200% 100%;animation:skel 1.5s infinite;}
@keyframes skel{0%{background-position:200% 0}100%{background-position:-200% 0}}
.skel-line{height:14px;border-radius:4px;margin-bottom:8px;}
.loading-tag{font-size:11px;color:var(--muted);font-style:italic;}

/* ─── MISC ─── */
.section-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
.section-title{font-size:15px;font-weight:700;color:var(--text);}
.divider{height:1px;background:var(--border);margin:20px 0;}
.mono{font-family:var(--mono);}
.tnum{font-variant-numeric:tabular-nums;}
.empty{text-align:center;padding:40px;color:var(--muted);font-size:13px;}
.source-tag{font-size:10px;font-weight:700;padding:1px 5px;border-radius:3px;text-transform:uppercase;}
.tag-yf{background:#6001d1;color:#fff;}
.tag-bb{background:#ff4800;color:#fff;}
.tag-ws{background:#ff4500;color:#fff;}
.tag-an{background:#0a1628;color:#fff;}
.tag-tw{background:#1d9bf0;color:#fff;}
.tag-se{background:#8b5cf6;color:#fff;}
.tag-ms{background:#dc2626;color:#fff;}

/* ─── MODAL ─── */
.modal-ov{position:fixed;inset:0;background:rgba(10,22,40,.5);z-index:200;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(4px);}
.modal-box{background:var(--white);border-radius:var(--r);padding:28px;width:540px;max-width:96vw;max-height:90vh;overflow-y:auto;box-shadow:var(--shadow2);}
.modal-box h2{font-size:18px;font-weight:700;margin-bottom:20px;}
.modal-footer{display:flex;gap:8px;justify-content:flex-end;margin-top:20px;padding-top:16px;border-top:1px solid var(--border);}
.form-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
.form-full{grid-column:1/-1;}
.fg{display:flex;flex-direction:column;gap:5px;}
.fg label{font-size:11px;color:var(--muted);font-weight:600;letter-spacing:.5px;text-transform:uppercase;}
.fg input,.fg select{background:var(--grey1);border:1px solid var(--border);border-radius:var(--r2);padding:8px 11px;color:var(--text);font-family:var(--font);font-size:13px;outline:none;transition:border-color .13s;}
.fg input:focus,.fg select:focus{border-color:var(--blue);background:var(--white);}

/* ─── TICKER SEARCH ─── */
.tsr-wrap{position:relative;}
.tsr-dd{position:absolute;top:calc(100% + 4px);left:0;right:0;background:var(--white);border:1px solid var(--border);border-radius:var(--r);z-index:300;max-height:240px;overflow-y:auto;box-shadow:var(--shadow2);display:none;}
.tsr-opt{display:flex;align-items:center;padding:9px 13px;cursor:pointer;gap:10px;border-bottom:1px solid var(--border);}
.tsr-opt:last-child{border-bottom:none;}
.tsr-opt:hover,.tsr-opt.hi{background:var(--grey1);}
.tsr-sym{font-family:var(--mono);font-size:12px;font-weight:700;color:var(--blue);min-width:60px;}
.tsr-name{font-size:12px;flex:1;}
.tsr-ex{font-size:10px;color:var(--muted);}
.tsr-px{font-family:var(--mono);font-size:12px;font-weight:600;}
.tsr-loading{padding:12px;text-align:center;color:var(--muted);font-size:12px;}
.sel-card{background:var(--grey1);border:1px solid var(--border);border-radius:var(--r);padding:12px 14px;margin-top:8px;display:flex;align-items:center;gap:12px;display:none;}
.sel-sym{font-size:20px;font-weight:800;color:var(--blue);font-family:var(--mono);}
.sel-info{flex:1;}
.sel-name{font-size:13px;font-weight:600;}
.sel-det{font-size:11px;color:var(--muted);margin-top:1px;}
.sel-px{text-align:right;}
.sel-px-val{font-size:18px;font-weight:700;}
.sel-px-chg{font-size:11px;margin-top:1px;}
.hint{font-size:11px;color:var(--blue);margin-top:4px;font-weight:500;}

/* ─── TOAST ─── */
.toast{position:fixed;bottom:22px;right:22px;background:var(--navy);border-left:3px solid var(--blue2);border-radius:8px;padding:12px 18px;color:#fff;font-size:12px;z-index:500;opacity:0;transform:translateY(6px);transition:all .25s;pointer-events:none;max-width:280px;}
.toast.on{opacity:1;transform:none;}

/* ─── SPINNER ─── */
.spin{animation:rotate .7s linear infinite;}
@keyframes rotate{to{transform:rotate(360deg)}}

/* ─── SCROLLBAR ─── */
::-webkit-scrollbar{width:5px;height:5px;}
::-webkit-scrollbar-track{background:var(--grey1);}
::-webkit-scrollbar-thumb{background:var(--grey3);border-radius:3px;}

/* ─── RESPONSIVE ─── */
@media(max-width:900px){.sidebar{display:none}.kpi-row{grid-template-columns:repeat(2,1fr)}.grid2,.grid3{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="shell">

<!-- ═══ SIDEBAR ═══ -->
<nav class="sidebar">
  <div class="sb-logo">
    <h1>⬡ Portfolio Pro</h1>
    <span>by Claude · Live Data</span>
  </div>
  <div class="sb-section">Cartera</div>
  <div class="nav">
    <div class="nv on" onclick="nav('overview')" id="nv-overview">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
      Resumen
    </div>
    <div class="nv" onclick="nav('positions')" id="nv-positions">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
      Posiciones
    </div>
    <div class="nv" onclick="nav('activity')" id="nv-activity">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
      Actividad
    </div>
    <div class="nv" onclick="nav('pnl')" id="nv-pnl">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></svg>
      Rentabilidad
    </div>
  </div>
  <div class="sb-section">Análisis</div>
  <div class="nav">
    <div class="nv" onclick="nav('news')" id="nv-news">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 22h16a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2H8a2 2 0 0 0-2 2v16a4 4 0 0 1-4-4V6"/><line x1="10" y1="7" x2="18" y2="7"/><line x1="10" y1="11" x2="18" y2="11"/></svg>
      Noticias
    </div>
    <div class="nv" onclick="nav('analyst')" id="nv-analyst">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
      Analistas & IA
    </div>
  </div>
  <div class="sb-bottom">
    <div class="sb-pf-card">
      <div style="font-size:10px;color:rgba(255,255,255,.3);letter-spacing:1px;text-transform:uppercase;margin-bottom:5px;">Valor cartera</div>
      <div class="sb-pf-val" id="sb-val">—</div>
      <div class="sb-pf-chg up" id="sb-chg">—</div>
    </div>
    <button class="sb-reset" onclick="hardReset()">↺ Resetear datos</button>
  </div>
</nav>

<!-- ═══ CONTENT ═══ -->
<div class="content-area">
  <div class="topbar">
    <div class="tb-left">
      <div>
        <div class="tb-title" id="tb-title">Resumen de cartera</div>
        <div class="tb-sub" id="tb-sub">21 may 2026 · EUR · Datos en tiempo real</div>
      </div>
    </div>
    <div class="tb-right">
      <div class="live-pill"><span class="live-dot"></span>Live</div>
      <button class="btn" onclick="refreshAll()" id="refresh-btn">
        <svg id="refresh-ico" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
        Actualizar
      </button>
      <button class="btn btn-blue" onclick="openAddModal()">+ Operación</button>
    </div>
  </div>

  <div class="tabs" id="tabs">
    <div class="tab on" onclick="nav('overview')" data-v="overview">Resumen</div>
    <div class="tab" onclick="nav('positions')" data-v="positions">Posiciones</div>

// ═══════════════════════════════════════════════════════════
//  YAHOO FINANCE — CORS-safe
// ═══════════════════════════════════════════════════════════
async function yFetch(url){
  // 1) try direct
  try{
    const r=await fetch(url,{headers:{'Accept':'application/json'}});
    if(r.ok) return r.json();
  }catch(_){}
  // 2) allorigins proxy
  try{
    const r=await fetch(`https://api.allorigins.win/get?url=${encodeURIComponent(url)}`);
    if(!r.ok) return null;
    const w=await r.json();
    return JSON.parse(w.contents);
  }catch(_){ return null; }
}

async function searchTickers(q){
  if(!q||q.length<1) return [];
  const url=`https://query1.finance.yahoo.com/v1/finance/search?q=${encodeURIComponent(q)}&lang=en-US&region=US&quotesCount=8&newsCount=0`;
  const d=await yFetch(url);
  if(!d) return [];
  return (d.quotes||[]).filter(x=>['EQUITY','ETF'].includes(x.quoteType)).slice(0,7);
}

async function fetchPrice(t){
  const url=`https://query1.finance.yahoo.com/v8/finance/chart/${encodeURIComponent(t)}?interval=1d&range=1d`;
  const d=await yFetch(url);
  if(!d) return null;
  const m=d.chart?.result?.[0]?.meta;
  if(!m) return null;
  const p=m.regularMarketPrice||m.previousClose||0;
  const prev=m.previousClose||p;
  return {price:p, prev, change:p-prev, pct:prev?(p-prev)/prev*100:0, currency:m.currency||'USD'};
}

async function fetchNews(ticker){
  const url=`https://query1.finance.yahoo.com/v1/finance/search?q=${encodeURIComponent(ticker)}&lang=en-US&region=US&quotesCount=0&newsCount=6`;
  const d=await yFetch(url);
  return (d?.news||[]);
}

function getPositions(){
  const pos={};
  S.ops.forEach(op=>{
    if(!pos[op.ticker]) pos[op.ticker]={ticker:op.ticker,name:op.name||(S.meta[op.ticker]?.name||op.ticker),shares:0,cost:0,realized:0,invested:0};
    if(op.type==='BUY'){
      const p=pos[op.ticker];
      const ns=p.shares+op.shares;
      p.cost=p.shares>0?(p.cost*p.shares+op.price*op.shares)/ns:op.price;
      p.shares=ns;
      p.invested+=op.price*op.shares+(op.commission||0);
    } else {
      const cb=pos[op.ticker].cost;
      pos[op.ticker].realized+=(op.price-cb)*op.shares-(op.commission||0);
      pos[op.ticker].shares-=op.shares;
      pos[op.ticker].invested-=cb*op.shares;
    }
  });
  return Object.values(pos).filter(p=>p.shares>0.0001).map(p=>{
    const px=S.prices[p.ticker]||p.cost;
    return {...p, px, mv:px*p.shares, unreal:(px-p.cost)*p.shares, pct:p.cost?(px-p.cost)/p.cost*100:0};
  });
}

function getStats(){
  const pos=getPositions();
  const totalInv=S.ops.filter(o=>o.type==='BUY').reduce((s,o)=>s+o.price*o.shares+(o.commission||0),0);
  const realized=S.ops.filter(o=>o.type==='SELL').reduce((s,o)=>{
    const avg=avgCostBefore(o.ticker,o.id);
    return s+(o.price-avg)*o.shares-(o.commission||0);
  },0);
  const mv=pos.reduce((s,p)=>s+p.mv,0);
  const unreal=pos.reduce((s,p)=>s+p.unreal,0);
  const total=realized+unreal;
  return {pos,totalInv,realized,mv,unreal,total,totalPct:totalInv?total/totalInv*100:0};
}

function avgCostBefore(ticker,beforeId){
  let sh=0,c=0;
  S.ops.filter(o=>o.ticker===ticker&&o.id<beforeId).forEach(op=>{
    if(op.type==='BUY'){const p=sh;sh+=op.shares;c=p>0?(c*p+op.price*op.shares)/sh:op.price;}
    else sh-=op.shares;
  });
  return c;
}

function buildEvoData(){
  const ops=[...S.ops].sort((a,b)=>a.date.localeCompare(b.date));
  if(!ops.length) return [];
  const pts=[]; let cur=new Date(ops[0].date); const end=new Date();
  while(cur<=end){
    const ds=cur.toISOString().split('T')[0];
    const snap={};
    ops.filter(o=>o.date<=ds).forEach(op=>{
      if(!snap[op.ticker])snap[op.ticker]={sh:0,c:0};
      if(op.type==='BUY'){const p=snap[op.ticker].sh;snap[op.ticker].c=p>0?(snap[op.ticker].c*p+op.price*op.shares)/(p+op.shares):op.price;snap[op.ticker].sh+=op.shares;}
      else snap[op.ticker].sh=Math.max(0,snap[op.ticker].sh-op.shares);
    });
    let mv=0,cost=0;
    Object.keys(snap).forEach(t=>{const px=S.prices[t]||snap[t].c;mv+=px*snap[t].sh;cost+=snap[t].c*snap[t].sh;});
    if(cur.getDate()===1||cur>=end) pts.push({l:cur.toLocaleDateString('es-ES',{month:'short',year:'2-digit'}),mv,cost});
    cur.setMonth(cur.getMonth()+1);
  }
  return pts;
}

function getAllPos(){
  const pos={};
  S.ops.forEach(op=>{
    if(!pos[op.ticker])pos[op.ticker]={ticker:op.ticker,name:op.name||(S.meta[op.ticker]?.name||op.ticker),shares:0,cost:0,realized:0,invested:0};
    if(op.type==='BUY'){const p=pos[op.ticker];const ns=p.shares+op.shares;p.cost=p.shares>0?(p.cost*p.shares+op.price*op.shares)/ns:op.price;p.shares=ns;p.invested+=op.price*op.shares+(op.commission||0);}
    else{const cb=pos[op.ticker].cost;pos[op.ticker].realized+=(op.price-cb)*op.shares-(op.commission||0);pos[op.ticker].shares-=op.shares;}
  });
  return Object.values(pos).map(p=>({...p,unreal:p.shares>0.001?((S.prices[p.ticker]||p.cost)-p.cost)*p.shares:0}));
}

function buildMonthly(){
  const ctx=document.getElementById('monthlyChart');if(!ctx)return;
  const m={};
  S.ops.filter(o=>o.type==='SELL').forEach(op=>{
    const mo=op.date.substring(0,7),a=avgCostBefore(op.ticker,op.id);
    m[mo]=(m[mo]||0)+(op.price-a)*op.shares-(op.commission||0);
  });
  const labels=Object.keys(m).sort(),data=labels.map(l=>+m[l].toFixed(2));
  dch('monthly');
  CH['monthly']=new Chart(ctx,{type:'bar',
    data:{labels:labels.map(l=>{const d=new Date(l+'-01');return d.toLocaleDateString('es-ES',{month:'short',year:'2-digit'});}),
          datasets:[{data,backgroundColor:data.map(v=>v>=0?'rgba(15,160,101,.55)':'rgba(217,48,37,.55)'),borderColor:data.map(v=>v>=0?'#0fa065':'#d93025'),borderWidth:1,borderRadius:3,label:'P&L'}]},
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{...TIP,callbacks:{label:c=>(c.raw>=0?'+':'')+fmtE(c.raw)}}},
      scales:{x:{grid:{color:'rgba(0,0,0,0.04)'},ticks:{color:'#7a90aa',font:{size:10}}},
              y:{grid:{color:'rgba(0,0,0,0.04)'},ticks:{color:'#7a90aa',font:{size:10},callback:v=>fmtE(v)}}}}});
}

function buildRvU(s){
  const ctx=document.getElementById('rvuChart');if(!ctx)return;
  const r=Math.max(0,s.realized),u=Math.max(0,s.unreal);
  if(!r&&!u)return;
  dch('rvu');
  CH['rvu']=new Chart(ctx,{type:'doughnut',
    data:{labels:['Realizado','Latente'],datasets:[{data:[+r.toFixed(2),+u.toFixed(2)],backgroundColor:['#1a6ef5','#0fa065'],borderWidth:2,borderColor:'#fff',hoverOffset:4}]},
    options:{responsive:true,maintainAspectRatio:false,cutout:'65%',plugins:{legend:{display:false},tooltip:{...TIP,callbacks:{label:c=>fmtE(c.raw)}}}}});
}
