<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portfolio Tracker Pro</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --navy:#0a1628;--navy2:#0f2044;--navy3:#16305a;
  --blue:#1a6ef5;--blue2:#3b8bff;--blue3:#d0e4ff;
  --g1:#f0f4fa;--g2:#e2e8f4;--g3:#b8c5d6;--g4:#7a90aa;
  --white:#fff;--text:#0a1628;--muted:#5a7090;
  --green:#0fa065;--green2:#e6f7f0;--red:#d93025;--red2:#fde8e8;
  --amber:#f59e0b;--border:rgba(10,22,40,.09);
  --shadow:0 1px 4px rgba(10,22,40,.08);--shadow2:0 4px 20px rgba(10,22,40,.12);
  --r:10px;--r2:6px;--font:'Inter',sans-serif;--mono:'IBM Plex Mono',monospace;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;background:var(--g1);color:var(--text);font-family:var(--font);font-size:14px;line-height:1.5;}
.shell{display:flex;height:100vh;overflow:hidden;}
.sidebar{width:236px;min-width:236px;background:var(--navy);display:flex;flex-direction:column;overflow-y:auto;}
.content-area{flex:1;overflow-y:auto;display:flex;flex-direction:column;}
.topbar{background:var(--white);border-bottom:1px solid var(--border);padding:0 28px;height:54px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;position:sticky;top:0;z-index:50;}
.page{padding:24px 28px;flex:1;}
/* sidebar */
.sb-logo{padding:22px 20px 16px;border-bottom:1px solid rgba(255,255,255,.07);}
.sb-logo h1{font-size:17px;font-weight:700;color:#fff;letter-spacing:-.3px;}
.sb-logo span{font-size:10px;color:rgba(255,255,255,.3);letter-spacing:2px;text-transform:uppercase;}
.sb-section{font-size:10px;color:rgba(255,255,255,.25);letter-spacing:2px;text-transform:uppercase;padding:16px 20px 5px;}
.nav{display:flex;flex-direction:column;gap:1px;}
.nv{display:flex;align-items:center;gap:9px;padding:9px 20px;cursor:pointer;color:rgba(255,255,255,.5);font-size:13px;font-weight:500;border-left:2px solid transparent;transition:all .13s;}
.nv svg{width:15px;height:15px;flex-shrink:0;}
.nv:hover{color:rgba(255,255,255,.85);background:rgba(255,255,255,.05);}
.nv.on{color:#fff;border-left-color:var(--blue2);background:rgba(26,110,245,.12);}
.sb-bottom{margin-top:auto;padding:14px 16px;border-top:1px solid rgba(255,255,255,.07);}
.sb-pf-card{background:rgba(255,255,255,.05);border-radius:8px;padding:12px 14px;}
.sb-pf-val{font-size:20px;font-weight:700;color:#fff;}
.sb-pf-chg{font-size:12px;margin-top:2px;}
.sb-reset{width:100%;margin-top:8px;padding:6px;border-radius:5px;background:transparent;border:1px solid rgba(255,255,255,.1);color:rgba(255,255,255,.3);cursor:pointer;font-size:10px;font-family:var(--font);}
.sb-reset:hover{color:rgba(255,255,255,.6);}
/* topbar */
.tb-title{font-size:16px;font-weight:600;}
.tb-sub{font-size:12px;color:var(--muted);}
.tb-right{display:flex;align-items:center;gap:8px;}
.live-pill{display:flex;align-items:center;gap:5px;background:var(--green2);color:var(--green);border-radius:20px;padding:3px 10px;font-size:11px;font-weight:600;}
.live-dot{width:6px;height:6px;border-radius:50%;background:var(--green);animation:pulse 2s infinite;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.btn{padding:7px 14px;border-radius:var(--r2);border:1px solid var(--border);background:var(--white);color:var(--text);cursor:pointer;font-family:var(--font);font-size:12px;font-weight:500;display:inline-flex;align-items:center;gap:5px;transition:all .13s;}
.btn:hover{background:var(--g2);}
.btn-blue{background:var(--blue);color:#fff;border-color:var(--blue);}
.btn-blue:hover{background:#155ed4;}
.btn-sm{padding:5px 10px;font-size:11px;}
/* tabs */
.tabs{display:flex;border-bottom:1px solid var(--border);background:var(--white);padding:0 28px;flex-shrink:0;}
.tab{padding:12px 16px;cursor:pointer;font-size:13px;font-weight:500;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap;transition:all .13s;}
.tab:hover{color:var(--text);}
.tab.on{color:var(--blue);border-bottom-color:var(--blue);}
/* kpis */
.kpi-row{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:20px;}
.kpi{background:var(--white);border:1px solid var(--border);border-radius:var(--r);padding:16px 18px;box-shadow:var(--shadow);}
.kpi-l{font-size:11px;color:var(--muted);letter-spacing:.5px;text-transform:uppercase;margin-bottom:6px;font-weight:500;}
.kpi-v{font-size:20px;font-weight:700;line-height:1.2;}
.kpi-s{font-size:11px;margin-top:4px;}
.up{color:var(--green);}
.dn{color:var(--red);}
.nt{color:var(--muted);}
/* cards */
.card{background:var(--white);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow);}
.card-h{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--border);}
.card-title{font-size:13px;font-weight:600;}
.card-body{padding:20px;}
.grid2{display:grid;grid-template-columns:2fr 1fr;gap:14px;margin-bottom:20px;}
/* table */
.tbl-wrap{overflow-x:auto;}
table{width:100%;border-collapse:collapse;}
th{text-align:left;font-size:11px;color:var(--muted);font-weight:600;letter-spacing:.5px;text-transform:uppercase;padding:10px 14px;border-bottom:1px solid var(--border);white-space:nowrap;}
td{padding:11px 14px;border-bottom:1px solid var(--border);font-size:13px;white-space:nowrap;}
tr:last-child td{border-bottom:none;}
tr:hover td{background:var(--g1);}
.sym{font-size:11px;font-weight:700;background:var(--navy);color:#fff;border-radius:4px;padding:3px 7px;font-family:var(--mono);letter-spacing:.5px;display:inline-block;}
.sym.red{background:#c0392b;}.sym.green{background:#1a7a50;}.sym.blue{background:var(--blue);}
.sym.purple{background:#6c3fc7;}.sym.teal{background:#0e7a8a;}.sym.amber{background:#b45309;}
.sym.pink{background:#a3315a;}.sym.navy{background:var(--navy2);}
.co-name{font-size:12px;color:var(--muted);margin-top:1px;}
.badge{display:inline-block;padding:2px 8px;border-radius:3px;font-size:10px;font-weight:700;}
.b-buy{background:var(--green2);color:var(--green);}
.b-sell{background:var(--red2);color:var(--red);}
.b-hold{background:#fffbe6;color:#b45309;}
.weight-track{width:80px;height:5px;background:var(--g2);border-radius:3px;overflow:hidden;margin-top:3px;}
.weight-fill{height:100%;border-radius:3px;}
.chg-pill{display:inline-block;padding:2px 7px;border-radius:4px;font-size:11px;font-weight:600;}
.chg-up{background:var(--green2);color:var(--green);}
.chg-dn{background:var(--red2);color:var(--red);}
/* activity */
.act-list{display:flex;flex-direction:column;}
.act-item{display:flex;align-items:center;padding:13px 20px;border-bottom:1px solid var(--border);gap:14px;}
.act-item:hover{background:var(--g1);}
.act-item:last-child{border-bottom:none;}
.act-ico{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.act-ico.buy{background:var(--green2);}
.act-ico.sell{background:var(--red2);}
.act-ico svg{width:16px;height:16px;}
.act-body{flex:1;}
.act-title{font-size:13px;font-weight:600;}
.act-sub{font-size:11px;color:var(--muted);margin-top:1px;}
.act-val{text-align:right;}
.act-amount{font-size:14px;font-weight:600;}
.act-pnl{font-size:11px;margin-top:2px;}
.act-badge{display:inline-block;padding:1px 7px;border-radius:10px;font-size:10px;font-weight:600;margin-left:6px;}
/* news */
.news-list{display:flex;flex-direction:column;}
.news-item{padding:14px 20px;border-bottom:1px solid var(--border);display:flex;gap:12px;}
.news-item:last-child{border-bottom:none;}
.news-item:hover{background:var(--g1);}
.news-src{flex-shrink:0;display:flex;flex-direction:column;align-items:center;gap:3px;}
.news-src-badge{font-size:9px;font-weight:700;padding:2px 6px;border-radius:3px;text-transform:uppercase;}
.news-body{flex:1;}
.news-headline{font-size:13px;font-weight:600;cursor:pointer;line-height:1.4;}
.news-headline:hover{color:var(--blue);}
.news-meta{font-size:11px;color:var(--muted);margin-top:3px;}
.news-tickers{margin-top:5px;display:flex;gap:4px;flex-wrap:wrap;}
.news-ticker{font-size:10px;background:var(--blue3);color:var(--blue);padding:1px 6px;border-radius:3px;font-weight:600;}
.sent-pos{background:var(--green2);color:var(--green);font-size:10px;padding:2px 7px;border-radius:3px;font-weight:600;}
.sent-neg{background:var(--red2);color:var(--red);font-size:10px;padding:2px 7px;border-radius:3px;font-weight:600;}
.sent-nt{background:var(--g2);color:var(--muted);font-size:10px;padding:2px 7px;border-radius:3px;font-weight:600;}
/* ai */
.ai-banner{background:linear-gradient(135deg,var(--navy2),var(--navy3));border-radius:var(--r);padding:20px 24px;margin-bottom:16px;color:#fff;}
.ai-model{font-size:10px;color:var(--blue2);letter-spacing:1.5px;text-transform:uppercase;font-weight:700;margin-bottom:8px;}
.ai-text{font-size:13px;line-height:1.7;color:rgba(255,255,255,.88);}
.ai-sources{margin-top:10px;display:flex;gap:6px;flex-wrap:wrap;}
.ai-src-tag{font-size:10px;background:rgba(255,255,255,.1);color:rgba(255,255,255,.6);padding:2px 8px;border-radius:3px;border:1px solid rgba(255,255,255,.15);}
.analyst-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;margin-bottom:16px;}
.analyst-card{background:var(--white);border:1px solid var(--border);border-radius:var(--r);padding:14px 16px;}
.an-bar{height:4px;background:var(--g2);border-radius:2px;margin-top:8px;overflow:hidden;}
.an-bar-fill{height:100%;border-radius:2px;}
/* donut */
.donut-layout{display:flex;gap:20px;align-items:flex-start;}
.donut-wrap{position:relative;height:220px;min-width:220px;}
.donut-legend{display:flex;flex-direction:column;gap:8px;flex:1;}
.dl-item{display:flex;align-items:center;gap:8px;font-size:12px;}
.dl-dot{width:8px;height:8px;border-radius:2px;flex-shrink:0;}
/* modal */
.modal-ov{position:fixed;inset:0;background:rgba(10,22,40,.5);z-index:200;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(4px);}
.modal-box{background:var(--white);border-radius:var(--r);padding:28px;width:540px;max-width:96vw;max-height:90vh;overflow-y:auto;box-shadow:var(--shadow2);}
.modal-box h2{font-size:18px;font-weight:700;margin-bottom:20px;}
.modal-footer{display:flex;gap:8px;justify-content:flex-end;margin-top:20px;padding-top:16px;border-top:1px solid var(--border);}
.form-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
.form-full{grid-column:1/-1;}
.fg{display:flex;flex-direction:column;gap:5px;}
.fg label{font-size:11px;color:var(--muted);font-weight:600;letter-spacing:.5px;text-transform:uppercase;}
.fg input,.fg select{background:var(--g1);border:1px solid var(--border);border-radius:var(--r2);padding:8px 11px;color:var(--text);font-family:var(--font);font-size:13px;outline:none;transition:border-color .13s;}
.fg input:focus,.fg select:focus{border-color:var(--blue);background:var(--white);}
/* ticker search */
.tsr-wrap{position:relative;}
.tsr-dd{position:absolute;top:calc(100% + 4px);left:0;right:0;background:var(--white);border:1px solid var(--border);border-radius:var(--r);z-index:300;max-height:240px;overflow-y:auto;box-shadow:var(--shadow2);display:none;}
.tsr-opt{display:flex;align-items:center;padding:9px 13px;cursor:pointer;gap:10px;border-bottom:1px solid var(--border);}
.tsr-opt:last-child{border-bottom:none;}
.tsr-opt:hover,.tsr-opt.hi{background:var(--g1);}
.tsr-sym{font-family:var(--mono);font-size:12px;font-weight:700;color:var(--blue);min-width:60px;}
.tsr-name{font-size:12px;flex:1;}
.tsr-ex{font-size:10px;color:var(--muted);}
.tsr-px{font-family:var(--mono);font-size:12px;font-weight:600;}
.tsr-loading{padding:12px;text-align:center;color:var(--muted);font-size:12px;}
.sel-card{background:var(--g1);border:1px solid var(--border);border-radius:var(--r);padding:12px 14px;margin-top:8px;align-items:center;gap:12px;display:none;}
.hint{font-size:11px;color:var(--blue);margin-top:4px;font-weight:500;}
/* toast */
.toast{position:fixed;bottom:22px;right:22px;background:var(--navy);border-left:3px solid var(--blue2);border-radius:8px;padding:12px 18px;color:#fff;font-size:12px;z-index:500;opacity:0;transform:translateY(6px);transition:all .25s;pointer-events:none;max-width:280px;}
.toast.on{opacity:1;transform:none;}
.spin{animation:rotate .7s linear infinite;}
@keyframes rotate{to{transform:rotate(360deg)}}
::-webkit-scrollbar{width:5px;height:5px;}
::-webkit-scrollbar-track{background:var(--g1);}
::-webkit-scrollbar-thumb{background:var(--g3);border-radius:3px;}
.section-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
.section-title{font-size:15px;font-weight:700;}
.tag-yf{background:#6001d1;color:#fff;}
.tag-bb{background:#ff4800;color:#fff;}
.tag-an{background:#0a1628;color:#fff;}
.tag-se{background:#8b5cf6;color:#fff;}
.tag-ms{background:#dc2626;color:#fff;}
.tag-ft{background:#cc0000;color:#fff;}
.tag-tw{background:#1d9bf0;color:#fff;}
@media(max-width:900px){.sidebar{display:none}.kpi-row{grid-template-columns:repeat(2,1fr)}.grid2{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="shell">
<nav class="sidebar">
  <div class="sb-logo">
    <h1>Portfolio Pro</h1>
    <span>by Claude · Live Data</span>
  </div>
  <div class="sb-section">Cartera</div>
  <div class="nav">

      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>Resumen
    </div>
    <div class="nv" id="nv-positions" onclick="nav('positions')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>Posiciones
    </div>
    <div class="nv" id="nv-activity" onclick="nav('activity')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>Actividad
    </div>
    <div class="nv" id="nv-pnl" onclick="nav('pnl')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></svg>Rentabilidad
    </div>
  </div>
  <div class="sb-section">Análisis</div>
  <div class="nav">
    <div class="nv" id="nv-news" onclick="nav('news')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 22h16a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2H8a2 2 0 0 0-2 2v16a4 4 0 0 1-4-4V6"/><line x1="10" y1="7" x2="18" y2="7"/><line x1="10" y1="11" x2="18" y2="11"/></svg>Noticias
    </div>
    <div class="nv" id="nv-analyst" onclick="nav('analyst')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>Analistas &amp; IA
    </div>
  </div>
  <div class="sb-bottom">
    <div class="sb-pf-card">
      <div style="font-size:10px;color:rgba(255,255,255,.3);letter-spacing:1px;text-transform:uppercase;margin-bottom:5px;">Valor cartera</div>
      <div class="sb-pf-val" id="sb-val">—</div>
      <div class="sb-pf-chg up" id="sb-chg">—</div>
    </div>
    <button class="sb-reset" onclick="hardReset()">Resetear datos</button>
  </div>
</nav>

<div class="content-area">
  <div class="topbar">
    <div>
      <div class="tb-title" id="tb-title">Resumen de cartera</div>
      <div class="tb-sub">21 may 2026 · EUR · Yahoo Finance</div>
    </div>
    <div class="tb-right">
      <div class="live-pill"><span class="live-dot"></span>Live</div>
      <button class="btn" id="refresh-btn" onclick="refreshAll()">
        <svg id="refresh-ico" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
        Actualizar
      </button>
      <button class="btn btn-blue" onclick="openAddModal()">+ Operación</button>
    </div>
  </div>
  <div class="tabs" id="tabs">
    <div class="tab on" data-v="overview" onclick="nav('overview')">Resumen</div>
    <div class="tab" data-v="positions" onclick="nav('positions')">Posiciones</div>
    <div class="tab" data-v="activity" onclick="nav('activity')">Actividad</div>
    <div class="tab" data-v="pnl" onclick="nav('pnl')">Rentabilidad</div>
    <div class="tab" data-v="news" onclick="nav('news')">Noticias</div>
    <div class="tab" data-v="analyst" onclick="nav('analyst')">Analistas &amp; IA</div>
  </div>
  <div class="page" id="page"></div>
</div>
</div>

<div class="modal-ov" id="modal" style="display:none">
  <div class="modal-box">
    <h2 id="modal-ttl">Nueva Operación</h2>
    <div id="modal-body"></div>
    <div class="modal-footer">
      <button class="btn" onclick="closeModal()">Cancelar</button>
      <button class="btn btn-blue" onclick="saveOp()">Guardar</button>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>

  ops:    JSON.parse(localStorage.getItem('pf_ops6')||'[]'),
  prices: JSON.parse(localStorage.getItem('pf_px6')||'{}'),

  S.ops = [

    {id:2, date:'2026-02-23',ticker:'SNAP', name:'Snap Inc.',                 type:'BUY', shares:20,   price:5.10,    commission:0, notes:''},
    {id:3, date:'2026-02-23',ticker:'FCX',  name:'Freeport-McMoRan',          type:'BUY', shares:5,    price:64.40,   commission:0, notes:''},
    {id:4, date:'2026-02-23',ticker:'TSM',  name:'Taiwan Semiconductor',      type:'BUY', shares:1,    price:366.68,  commission:0, notes:''},
    {id:5, date:'2026-02-23',ticker:'IREN', name:'IREN Ltd',                  type:'BUY', shares:10,   price:39.45,   commission:0, notes:''},
    {id:6, date:'2026-02-23',ticker:'HY9H', name:'SK Hynix',                  type:'BUY', shares:1,    price:564.00,  commission:0, notes:''},
    {id:7, date:'2026-02-23',ticker:'GOOG', name:'Alphabet Inc.',             type:'BUY', shares:1,    price:315.30,  commission:0, notes:''},
    {id:8, date:'2026-02-23',ticker:'SIMO', name:'Silicon Motion',            type:'BUY', shares:5,    price:135.00,  commission:0, notes:''},

// ── YAHOO FINANCE (CORS-safe) ──
function yFetch(url){
  return fetch(url).then(function(r){ if(r.ok) return r.json(); throw new Error('direct failed'); })
  .catch(function(){
    return fetch('https://api.allorigins.win/get?url='+encodeURIComponent(url))
      .then(function(r){ return r.json(); })
      .then(function(w){ return JSON.parse(w.contents); })
      .catch(function(){ return null; });
  });
}

function searchTickers(q){
  if(!q||q.length<1) return Promise.resolve([]);
  var url='https://query1.finance.yahoo.com/v1/finance/search?q='+encodeURIComponent(q)+'&lang=en-US&region=US&quotesCount=8&newsCount=0';
  return yFetch(url).then(function(d){
    if(!d) return [];
    return (d.quotes||[]).filter(function(x){ return x.quoteType==='EQUITY'||x.quoteType==='ETF'; }).slice(0,7);
  }).catch(function(){ return []; });
}

function fetchPrice(t){
  var url='https://query1.finance.yahoo.com/v8/finance/chart/'+encodeURIComponent(t)+'?interval=1d&range=1d';
  return yFetch(url).then(function(d){
    if(!d) return null;
    var m=d.chart&&d.chart.result&&d.chart.result[0]&&d.chart.result[0].meta;
    if(!m) return null;
    var p=m.regularMarketPrice||m.previousClose||0;
    var prev=m.previousClose||p;
    return {price:p, prev:prev, change:p-prev, pct:prev?(p-prev)/prev*100:0};
  }).catch(function(){ return null; });
}

async function refreshAll(){
  var btn=document.getElementById('refresh-btn');
  var ico=document.getElementById('refresh-ico');
  if(btn){btn.disabled=true;}
  if(ico){ico.classList.add('spin');}
  var tickers=[...new Set(S.ops.map(function(o){return o.ticker;}))];
  await Promise.allSettled(tickers.map(function(t){
    return fetchPrice(t).then(function(d){ if(d&&d.price>0) S.prices[t]=d.price; });
  }));
  saveAll();
  if(btn){btn.disabled=false;}
  if(ico){ico.classList.remove('spin');}
  toast('Precios actualizados');
  renderPage(currentView);
  updateSidebar();
}

// ── COMPUTED ──
function getPositions(){
  var pos={};
  S.ops.forEach(function(op){
    if(!pos[op.ticker]) pos[op.ticker]={ticker:op.ticker,name:op.name||(S.meta[op.ticker]?S.meta[op.ticker].name:op.ticker),shares:0,cost:0,realized:0,invested:0};
    if(op.type==='BUY'){
      var p=pos[op.ticker];
      var ns=p.shares+op.shares;
      p.cost=p.shares>0?(p.cost*p.shares+op.price*op.shares)/ns:op.price;
      p.shares=ns;
      p.invested+=op.price*op.shares+(op.commission||0);
    } else {
      var cb=pos[op.ticker].cost;
      pos[op.ticker].realized+=(op.price-cb)*op.shares-(op.commission||0);
      pos[op.ticker].shares-=op.shares;
      pos[op.ticker].invested-=cb*op.shares;
    }
  });
  return Object.values(pos).filter(function(p){ return p.shares>0.0001; }).map(function(p){
    var px=S.prices[p.ticker]||p.cost;
    return Object.assign({},p,{px:px,mv:px*p.shares,unreal:(px-p.cost)*p.shares,pct:p.cost?(px-p.cost)/p.cost*100:0});
  });
}

function getStats(){
  var pos=getPositions();
  var totalInv=S.ops.filter(function(o){return o.type==='BUY';}).reduce(function(s,o){return s+o.price*o.shares+(o.commission||0);},0);
  var realized=S.ops.filter(function(o){return o.type==='SELL';}).reduce(function(s,o){
    var avg=avgCostBefore(o.ticker,o.id);
    return s+(o.price-avg)*o.shares-(o.commission||0);
  },0);
  var mv=pos.reduce(function(s,p){return s+p.mv;},0);
  var unreal=pos.reduce(function(s,p){return s+p.unreal;},0);
  var total=realized+unreal;
  return {pos:pos,totalInv:totalInv,realized:realized,mv:mv,unreal:unreal,total:total,totalPct:totalInv?total/totalInv*100:0};
}

function avgCostBefore(ticker,beforeId){
  var sh=0,c=0;
  S.ops.filter(function(o){return o.ticker===ticker&&o.id<beforeId;}).forEach(function(op){
    if(op.type==='BUY'){var p=sh;sh+=op.shares;c=p>0?(c*p+op.price*op.shares)/sh:op.price;}
    else sh-=op.shares;
  });
  return c;
}

function getAllPos(){
  var pos={};
  S.ops.forEach(function(op){
    if(!pos[op.ticker]) pos[op.ticker]={ticker:op.ticker,name:op.name||(S.meta[op.ticker]?S.meta[op.ticker].name:op.ticker),shares:0,cost:0,realized:0,invested:0};
    if(op.type==='BUY'){
      var p=pos[op.ticker];var ns=p.shares+op.shares;
      p.cost=p.shares>0?(p.cost*p.shares+op.price*op.shares)/ns:op.price;
      p.shares=ns;p.invested+=op.price*op.shares+(op.commission||0);
    } else {
      var cb=pos[op.ticker].cost;
      pos[op.ticker].realized+=(op.price-cb)*op.shares-(op.commission||0);
      pos[op.ticker].shares-=op.shares;
    }
  });
  return Object.values(pos).map(function(p){
    return Object.assign({},p,{unreal:p.shares>0.001?((S.prices[p.ticker]||p.cost)-p.cost)*p.shares:0});
  });
}

function buildEvoData(){
  var ops=S.ops.slice().sort(function(a,b){return a.date.localeCompare(b.date);});
  if(!ops.length) return [];
  var pts=[],cur=new Date(ops[0].date),end=new Date();
  while(cur<=end){
    var ds=cur.toISOString().split('T')[0];
    var snap={};
    ops.filter(function(o){return o.date<=ds;}).forEach(function(op){
      if(!snap[op.ticker]) snap[op.ticker]={sh:0,c:0};
      if(op.type==='BUY'){var p=snap[op.ticker].sh;snap[op.ticker].c=p>0?(snap[op.ticker].c*p+op.price*op.shares)/(p+op.shares):op.price;snap[op.ticker].sh+=op.shares;}
      else snap[op.ticker].sh=Math.max(0,snap[op.ticker].sh-op.shares);
    });
    var mv=0,cost=0;
    Object.keys(snap).forEach(function(t){var px=S.prices[t]||snap[t].c;mv+=px*snap[t].sh;cost+=snap[t].c*snap[t].sh;});
    if(cur.getDate()===1||cur>=end) pts.push({l:cur.toLocaleDateString('es-ES',{month:'short',year:'2-digit'}),mv:mv,cost:cost});
    cur.setMonth(cur.getMonth()+1);
  }
  return pts;
}

function buildMonthly(){
  var ctx=document.getElementById('monthlyChart'); if(!ctx) return;
  var m={};
  S.ops.filter(function(o){return o.type==='SELL';}).forEach(function(op){
    var mo=op.date.substring(0,7),a=avgCostBefore(op.ticker,op.id);
    m[mo]=(m[mo]||0)+(op.price-a)*op.shares-(op.commission||0);
  });
  var labels=Object.keys(m).sort(),data=labels.map(function(l){return +m[l].toFixed(2);});
  dch('monthly');
  CH['monthly']=new Chart(ctx,{type:'bar',
    data:{labels:labels.map(function(l){var d=new Date(l+'-01');return d.toLocaleDateString('es-ES',{month:'short',year:'2-digit'});}),
      datasets:[{data:data,backgroundColor:data.map(function(v){return v>=0?'rgba(15,160,101,.55)':'rgba(217,48,37,.55)';}),
        borderColor:data.map(function(v){return v>=0?'#0fa065':'#d93025';}),borderWidth:1,borderRadius:3,label:'P&L'}]},
    options:{responsive:true,maintainAspectRatio:false,
      plugins:{legend:{display:false},tooltip:Object.assign({},TIP,{callbacks:{label:function(c){return (c.raw>=0?'+':'')+fmtE(c.raw);}}})},
      scales:{x:{grid:{color:'rgba(0,0,0,.04)'},ticks:{color:'#7a90aa',font:{size:10}}},
              y:{grid:{color:'rgba(0,0,0,.04)'},ticks:{color:'#7a90aa',font:{size:10},callback:function(v){return fmtE(v);}}}}}
  });
}

function buildRvU(s){
  var ctx=document.getElementById('rvuChart'); if(!ctx) return;
  var r=Math.max(0,s.realized),u=Math.max(0,s.unreal);
  if(!r&&!u) return;
  dch('rvu');
  CH['rvu']=new Chart(ctx,{type:'doughnut',
    data:{labels:['Realizado','Latente'],datasets:[{data:[+r.toFixed(2),+u.toFixed(2)],backgroundColor:['#1a6ef5','#0fa065'],borderWidth:2,borderColor:'#fff',hoverOffset:4}]},
    options:{responsive:true,maintainAspectRatio:false,cutout:'65%',plugins:{legend:{display:false},tooltip:Object.assign({},TIP,{callbacks:{label:function(c){return fmtE(c.raw);}}})}}
  });
}

  var ico=document.getElementById('news-ico');

  var tickers=getPositions().map(function(p){return p.ticker;}).slice(0,5);
  var allNews=[];
  var promises=tickers.map(function(t){
    var url='https://query1.finance.yahoo.com/v1/finance/search?q='+encodeURIComponent(t)+'&lang=en-US&region=US&quotesCount=0&newsCount=6';
    return yFetch(url).then(function(d){
      if(d&&d.news) d.news.forEach(function(item){allNews.push(Object.assign({},item,{ticker:t}));});

    +'<div class="card" style="margin-bottom:20px"><div class="tbl-wrap"><table><thead><tr><th>Ticker</th><th>Reddit/WSB</th><th>Menciones 24h</th><th>X (Twitter)</th><th>Analistas alcistas</th><th>Tendencia</th></tr></thead><tbody>'+sentRows+'</tbody></table></div></div>'

    +'<b>GOOG</b> — Solapamiento con S&P500. Evalúa si aporta valor diferencial real.<br>'
    +'<b>GRAB</b> — SE Asia + rentabilidad reciente. Revisar resultados Q2 2026.'
    +'</div></div>'
    +'</div>';
}

// ── MODAL ADD OPERATION ──
var selTicker=null,ddRes=[],ddIdx=-1,srchTO=null;

function openAddModal(pre){
  selTicker=null;
  document.getElementById('modal-ttl').textContent='Nueva Operación';
  document.getElementById('modal-body').innerHTML='<div class="form-grid">'
    +'<div class="fg form-full"><label>Buscar activo</label>'
    +'<div class="tsr-wrap"><input id="f-q" type="text" placeholder="Ej: Apple, NVDA, TSM..." autocomplete="off" oninput="onQ(this.value)" onkeydown="onQk(event)" value="'+(pre||'')+'">'
    +'<div class="tsr-dd" id="tsr-dd"></div></div>'
    +'<div class="sel-card" id="sel-card"></div>'
    +'<div class="hint" id="sel-hint" style="display:none"></div></div>'
    +'<div class="fg"><label>Tipo</label><select id="f-type"><option value="BUY">Compra</option><option value="SELL">Venta</option></select></div>'
    +'<div class="fg"><label>Fecha</label><input id="f-date" type="date" value="'+new Date().toISOString().split('T')[0]+'"></div>'
    +'<div class="fg"><label>Acciones</label><input id="f-sh" type="number" placeholder="10" min="0.001" step="0.001"></div>'
    +'<div class="fg"><label>Precio pactado</label><input id="f-px" type="number" placeholder="0.00" min="0" step="0.01"></div>'
    +'<div class="fg"><label>Comisión</label><input id="f-co" type="number" value="0" min="0" step="0.01"></div>'
    +'<div class="fg form-full"><label>Notas</label><input id="f-nt" type="text" placeholder="Opcional"></div>'
    +'</div>';
  document.getElementById('modal').style.display='flex';
  if(pre) preSel(pre);
}

function openSellModal(t){
  openAddModal(t);
  setTimeout(function(){var el=document.getElementById('f-type');if(el)el.value='SELL';},80);
}

function closeModal(){
  document.getElementById('modal').style.display='none';
  selTicker=null;
}

function preSel(t){
  var meta=S.meta[t];
  if(meta){
    selTicker={symbol:t,shortname:meta.name,exchDisp:meta.exchange};
    var qi=document.getElementById('f-q');
    if(qi) qi.value=t;
    showSelCard(selTicker,S.prices[t]||null,null);
  }
}

function onQ(v){
  clearTimeout(srchTO);
  var dd=document.getElementById('tsr-dd');
  if(!v||v.length<1){if(dd)dd.style.display='none';return;}
  if(dd){dd.innerHTML='<div class="tsr-loading">Buscando...</div>';dd.style.display='block';}
  srchTO=setTimeout(function(){
    searchTickers(v).then(function(res){
      ddRes=res;ddIdx=-1;
      if(!dd) return;
      if(!ddRes.length){dd.style.display='none';return;}
      dd.innerHTML=ddRes.map(function(r,i){
        return '<div class="tsr-opt" id="dd'+i+'" onclick="pickt('+i+')">'
          +'<span class="tsr-sym">'+r.symbol+'</span>'
          +'<span class="tsr-name">'+(r.shortname||r.longname||r.symbol)+'</span>'
          +'<span class="tsr-ex">'+(r.exchDisp||r.exchange||'')+'</span>'
          +'<span class="tsr-px" id="ddpx'+i+'">…</span></div>';
      }).join('');
      dd.style.display='block';
      ddRes.forEach(function(r,i){
        fetchPrice(r.symbol).then(function(d){
          var e=document.getElementById('ddpx'+i);
          if(e&&d) e.textContent='$'+d.price.toFixed(2); else if(e) e.textContent='';
        });
      });
    });
  },350);
}

function onQk(e){
  var dd=document.getElementById('tsr-dd');
  if(!dd||dd.style.display==='none') return;
  if(e.key==='ArrowDown'){ddIdx=Math.min(ddIdx+1,ddRes.length-1);hidd();e.preventDefault();}
  else if(e.key==='ArrowUp'){ddIdx=Math.max(ddIdx-1,0);hidd();e.preventDefault();}
  else if(e.key==='Enter'&&ddIdx>=0){pickt(ddIdx);e.preventDefault();}
  else if(e.key==='Escape'){dd.style.display='none';}
}
function hidd(){
  ddRes.forEach(function(_,i){var e=document.getElementById('dd'+i);if(e)e.classList.toggle('hi',i===ddIdx);});
}

function pickt(i){
  var r=ddRes[i]; if(!r) return;
  selTicker=r;
  var dd=document.getElementById('tsr-dd'); if(dd) dd.style.display='none';
  var qi=document.getElementById('f-q'); if(qi) qi.value=r.symbol;
  var sc2=document.getElementById('sel-card');
  if(sc2){sc2.innerHTML='<div style="padding:8px;color:var(--muted);font-size:12px">Obteniendo precio en tiempo real...</div>';sc2.style.display='flex';}
  fetchPrice(r.symbol).then(function(d){
    if(d&&d.price>0){S.prices[r.symbol]=d.price;S.meta[r.symbol]={name:r.shortname||r.symbol,exchange:r.exchDisp||''};saveAll();}
    showSelCard(r,d?d.price:null,d);
    var h=document.getElementById('sel-hint');
    if(h&&d){h.textContent='Precio de mercado: $'+d.price.toFixed(2)+' — introduce el precio al que cerraste la operación';h.style.display='block';}
  });
}

function showSelCard(r,price,pd){
  var sc2=document.getElementById('sel-card'); if(!sc2) return;
  sc2.innerHTML='<div style="width:40px;height:40px;border-radius:8px;background:var(--blue3);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--blue)">'+( r.symbol||'').substring(0,3)+'</div>'
    +'<div style="flex:1"><div style="font-weight:600;font-size:13px">'+(r.shortname||r.longname||r.symbol)+'</div>'
    +'<div style="font-size:11px;color:var(--muted)">'+(r.exchDisp||r.exchange||'')+'</div></div>'
    +(price?'<div style="text-align:right"><div style="font-size:18px;font-weight:700">$'+price.toFixed(2)+'</div>'+(pd&&pd.pct!==undefined?'<div style="font-size:11px" class="'+(pd.pct>=0?'up':'dn')+'">'+(pd.pct>=0?'+':'')+pd.pct.toFixed(2)+'%</div>':'')+'</div>':'');
  sc2.style.display='flex';
}

function saveOp(){
  if(!selTicker){toast('Selecciona un activo del buscador');return;}
  var t=selTicker.symbol.toUpperCase();
  var typeEl=document.getElementById('f-type');
  var dateEl=document.getElementById('f-date');
  var shEl=document.getElementById('f-sh');
  var pxEl=document.getElementById('f-px');
  var coEl=document.getElementById('f-co');
  var ntEl=document.getElementById('f-nt');
  var type=typeEl?typeEl.value:'BUY';
  var date=dateEl?dateEl.value:'';
  var sh=parseFloat(shEl?shEl.value:0);
  var px=parseFloat(pxEl?pxEl.value:0);
  var co=parseFloat(coEl?coEl.value:0)||0;
  var nt=ntEl?ntEl.value:'';
  if(!date||isNaN(sh)||isNaN(px)||sh<=0||px<=0){toast('Completa todos los campos requeridos');return;}
  S.meta[t]={name:selTicker.shortname||selTicker.longname||t,exchange:selTicker.exchDisp||selTicker.exchange||''};
  S.ops.push({id:nextId(),date:date,ticker:t,name:S.meta[t].name,type:type,shares:sh,price:px,commission:co,notes:nt});
  saveAll();
  closeModal();
  toast((type==='BUY'?'Compra':'Venta')+' de '+sh+' '+t+' guardada');
  nav(currentView);
  updateSidebar();
}

function delOp(id){
  if(!confirm('Eliminar esta operacion?')) return;
  S.ops=S.ops.filter(function(o){return o.id!==id;});
  saveAll();
  toast('Operacion eliminada');
  nav(currentView);
  updateSidebar();
}

function hardReset(){
  if(!confirm('Borrar TODOS los datos y restaurar los movimientos originales?')) return;
  ['pf_ops6','pf_px6','pf_meta6','pf_sv6'].forEach(function(k){localStorage.removeItem(k);});
  location.reload();
}

// ── UTILS ──
function fmtE(v){
  var n=Math.abs(+v||0);
  return (+v<0?'-':'')+'€'+n.toLocaleString('es-ES',{minimumFractionDigits:2,maximumFractionDigits:2});
}
function fmtP(v){ return '$'+(+(+v||0).toFixed(2)).toLocaleString('en-US',{minimumFractionDigits:2}); }
function n2(v){ return (+v||0).toFixed(2); }
function numK(v){ return v>=1000000?(v/1000000).toFixed(1)+'M':v>=1000?(v/1000).toFixed(0)+'K':(+v||0).toFixed(0); }
function toast(m){
  var t=document.getElementById('toast');
  t.textContent=m;t.classList.add('on');
  setTimeout(function(){t.classList.remove('on');},3200);
}

// ── CLOSE MODAL ON OVERLAY CLICK ──
document.getElementById('modal').addEventListener('click',function(e){
  if(e.target===document.getElementById('modal')) closeModal();
});
document.addEventListener('click',function(e){
  var dd=document.getElementById('tsr-dd');
  var wrap=document.querySelector('.tsr-wrap');
  if(dd&&wrap&&!wrap.contains(e.target)) dd.style.display='none';
});

// ── INIT ──
nav('overview');
updateSidebar();
// Auto-refresh prices silently on load
(function(){
  var tickers=[];
  S.ops.forEach(function(o){if(tickers.indexOf(o.ticker)<0)tickers.push(o.ticker);});
  Promise.allSettled(tickers.map(function(t){
    return fetchPrice(t).then(function(d){if(d&&d.price>0)S.prices[t]=d.price;});
  })).then(function(){
    saveAll();updateSidebar();renderPage(currentView);
  });
})();
</script>
